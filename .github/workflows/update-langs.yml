name: Update language stats

on:
  schedule:
    - cron: "0 6 * * *"
  push:
    branches: [main]
  repository_dispatch:
    types: [update-langs]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Recompute language percentages
        env:
          LANG_TOKEN: ${{ secrets.LANG_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/update-langs.js

      - name: Commit and push
        run: |
          if git diff --quiet README.md; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update language percentages"
          git push
